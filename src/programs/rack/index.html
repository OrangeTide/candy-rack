<!doctype html>
<!--
  web-rack: the Grape machine (funky electro groove synthesizer).
  Code is 0BSD. Non-code content is PUBLIC DOMAIN (CC0-1.0).

  The two web fonts are a progressive enhancement loaded from Google Fonts. If
  they do not load (offline), the system fallbacks keep the panel readable.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --disp: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --tech: 'Chakra Petch', ui-monospace, 'Consolas', monospace;

    /* Grape candy palette */
    --grape-1: #6a34c8;
    --grape-2: #4a2098;
    --grape-3: #331466;
    --grape-hi: #9a63e6;
    --plastic-edge: #21103f;
    --well: #180d33;
    --well-2: #120926;

    --ink: #f4ebff;
    --ink-dim: #b39ee0;
    --ink-mute: #7d68ad;

    --lime: #c3ff3e;
    --magenta: #ff3d9a;
    --cyan: #35e8ff;
    --amber: #ffb32e;
    --lamp: #ff5a7d;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--tech);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a1f66 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #5a1250 0%, transparent 55%),
      #0e0820;
    padding: 40px 18px 70px;
    -webkit-font-smoothing: antialiased;
  }

  /* Shown when the browser lacks AudioWorklet (e.g. iOS Safari < 14.5). */
  .unsupported {
    position: sticky; top: 0; z-index: 100;
    margin: -40px -18px 24px;
    padding: 12px 18px;
    background: #5a1250;
    border-bottom: 1px solid #a03a7a;
    color: var(--ink);
    font-size: 13px; line-height: 1.5; text-align: center;
  }

  /* ---- machine body ---- */
  .machine {
    position: relative;
    max-width: 860px;
    margin: 0 auto;
    padding: 22px 22px 30px;
    border-radius: 30px;
    background:
      linear-gradient(163deg, var(--grape-1) 0%, var(--grape-2) 52%, var(--grape-3) 100%);
    border: 1px solid var(--plastic-edge);
    box-shadow:
      0 2px 0 rgba(255,255,255,.16) inset,
      0 -34px 60px rgba(0,0,0,.30) inset,
      0 40px 90px rgba(0,0,0,.55),
      0 8px 0 #180b30;
    overflow: hidden;
  }
  /* Top gloss sweep */
  .machine::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 26%);
    pointer-events: none;
  }
  /* Molded plastic micro-texture */
  .machine::after {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: soft-light;
    opacity: .05;
    pointer-events: none;
  }
  .machine > * { position: relative; z-index: 1; }

  /* Corner screws */
  .screw {
    position: absolute; width: 16px; height: 16px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 38% 32%, #d9cff0, #6b5a90 55%, #2b2044 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 0 2px rgba(0,0,0,.18);
  }
  .screw::before {
    content: ''; position: absolute; inset: 4px; border-radius: 2px;
    background: linear-gradient(90deg, transparent 44%, rgba(0,0,0,.5) 44%, rgba(0,0,0,.5) 56%, transparent 56%);
    transform: rotate(35deg);
  }
  .screw.s1 { top: 12px; left: 12px; }
  .screw.s2 { top: 12px; right: 12px; }
  .screw.s3 { bottom: 12px; left: 12px; }
  .screw.s4 { bottom: 12px; right: 12px; }

  /* ---- brand ---- */
  .brand { display: flex; align-items: center; gap: 16px; padding: 6px 8px 18px; }
  .grape-logo { width: 58px; height: 66px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); flex: none; }
  .brand-text { display: flex; flex-direction: column; }
  .wordmark {
    font-family: var(--disp); font-weight: 800; font-size: 46px; line-height: .92;
    letter-spacing: .5px;
    background: linear-gradient(180deg, #f6ecff 0%, #d9b6ff 40%, #a862ff 72%, #7a34d8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.4));
  }
  .model {
    font-family: var(--tech); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 3px; color: var(--ink-dim); margin-top: 4px;
  }
  .brand-badge {
    margin-left: auto; align-self: flex-start;
    font-family: var(--disp); font-weight: 700; font-size: 12px; line-height: 1;
    text-transform: uppercase; letter-spacing: 1px; text-align: center; color: #2a0d1f;
    background: linear-gradient(180deg, #ff6aa9, var(--magenta));
    padding: 8px 12px; border-radius: 10px; transform: rotate(3deg);
    box-shadow: 0 3px 0 #b21e5f, 0 6px 12px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.5) inset;
  }

  /* Shared sub-panel look (raised molded card) */
  .head, .rail, .editor, .matrix, .io {
    border-radius: 16px;
  }

  /* Engraved section tag */
  .panel-tag, .matrix-title, .lane-tag, .lbl, .knob-label, .chip-n, .ed-title, .rlbl {
    font-family: var(--tech);
    text-shadow: 0 1px 0 rgba(0,0,0,.4), 0 -1px 0 rgba(255,255,255,.06);
  }

  /* ---- transport ---- */
  .head {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: linear-gradient(180deg, #5b2fb0, #3f1f86);
    border: 1px solid var(--plastic-edge);
    padding: 12px 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 6px 14px rgba(0,0,0,.35);
  }
  .panel-tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--ink-dim); font-weight: 600;
  }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .play {
    font-family: var(--disp); font-weight: 800; font-size: 17px; letter-spacing: 1px;
    color: #16330a;
    background: radial-gradient(120% 120% at 30% 20%, #e6ff8f, var(--lime) 55%, #83c015 100%);
    border: none; border-radius: 14px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 6px 0 #5f8a0e, 0 10px 18px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.6) inset;
    transition: transform .05s, box-shadow .05s;
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 #5f8a0e, 0 5px 10px rgba(0,0,0,.4); }

  /* Power lamp: standby amber, lit green while running */
  .power { display: flex; align-items: center; gap: 8px; }
  .lamp {
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffcf9c, #c25a24 68%, #7a3410 100%);
    box-shadow: 0 0 2px rgba(255,140,70,.4), 0 1px 2px rgba(0,0,0,.5) inset, 0 0 0 2px rgba(0,0,0,.28);
    transition: background .15s, box-shadow .15s;
  }
  .power.on .lamp {
    background: radial-gradient(circle at 36% 30%, #e2ffe9, #35e07a 58%, #12873f 100%);
    box-shadow: 0 0 12px rgba(53,224,122,.85), 0 0 4px rgba(53,224,122,1), 0 0 0 2px rgba(0,0,0,.25);
    animation: breathe 2.2s ease-in-out infinite;
  }
  .power-lbl { font-family: var(--tech); font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--ink-mute); font-weight: 600; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }

  /* LCD tempo panel */
  .lcd { display: flex; align-items: stretch; gap: 6px; }
  .lcd-screen {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 12px 7px;
    background: linear-gradient(180deg, #052421, #0a352d);
    border: 1px solid #000; border-radius: 9px; position: relative; overflow: hidden;
    box-shadow: 0 2px 7px rgba(0,0,0,.6) inset, 0 0 0 3px #1a0f34, 0 1px 0 rgba(255,255,255,.06);
  }
  .lcd-screen::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  .lcd-cap { font-family: var(--tech); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #45c7a6; text-shadow: 0 0 6px rgba(69,199,166,.5); }
  .lcd-val {
    font-family: var(--tech); font-weight: 700; font-size: 30px; line-height: 1; width: 66px; text-align: right;
    background: transparent; border: none; color: #82ffcf;
    text-shadow: 0 0 10px rgba(130,255,207,.7), 0 0 2px rgba(130,255,207,.9);
    -moz-appearance: textfield;
  }
  .lcd-val:focus { outline: none; }
  .lcd-val::-webkit-inner-spin-button, .lcd-val::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .lcd-unit { font-family: var(--tech); font-size: 11px; letter-spacing: 1px; color: #45c7a6; text-shadow: 0 0 6px rgba(69,199,166,.5); }
  .lcd-steppers { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .lcd-btn {
    font-family: var(--disp); font-weight: 700; font-size: 9px; line-height: 1; color: #23103f;
    background: linear-gradient(180deg, #c79bff, #9a63e6); border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer;
    box-shadow: 0 2px 0 #5b2fb0;
  }
  .lcd-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #5b2fb0; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--ink-mute); font-weight: 600; }
  .num, .sel {
    font-family: var(--tech); font-weight: 600; font-size: 15px; color: var(--cyan);
    background: linear-gradient(180deg, var(--well-2), var(--well));
    border: 1px solid #000; border-radius: 8px; padding: 6px 8px; width: 84px;
    box-shadow: 0 2px 5px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.06);
    text-shadow: 0 0 8px rgba(53,232,255,.5);
  }
  .sel { color: var(--ink); text-shadow: none; }

  /* ---- track rail ---- */
  .rail { margin-top: 16px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px 8px; cursor: pointer; text-align: center;
    background: linear-gradient(180deg, #4a2a92, #34196e);
    border: 1px solid var(--plastic-edge); border-radius: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 5px 10px rgba(0,0,0,.35);
    transition: transform .06s, box-shadow .1s, background .1s;
  }
  .chip::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    background: #2a1850; box-shadow: 0 0 0 2px rgba(0,0,0,.3) inset;
    transition: background .1s, box-shadow .1s;
  }
  .chip.active {
    background: linear-gradient(180deg, #6a3fd0, #4a24a4);
    box-shadow: 0 0 0 2px var(--lime) inset, 0 0 18px rgba(195,255,62,.35), 0 5px 12px rgba(0,0,0,.4);
  }
  .chip.active::before { background: var(--lime); box-shadow: 0 0 8px var(--lime); }
  .chip.fire { transform: translateY(-3px); }
  .chip.fire::before { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
  .chip-n { font-family: var(--disp); font-weight: 800; font-size: 15px; color: var(--amber); }
  .chip-eng { font-family: var(--tech); font-size: 9px; letter-spacing: .5px; color: var(--ink-dim); min-height: 12px; text-transform: uppercase; }
  .mute {
    font-family: var(--tech); font-size: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    background: #1c1140; color: var(--ink-mute); border: 1px solid #000; border-radius: 6px; padding: 3px 9px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .mute.on { background: linear-gradient(180deg, #ff6f8c, var(--lamp)); color: #2a0713; border-color: var(--lamp); box-shadow: 0 0 10px rgba(255,90,125,.5); }

  /* ---- editor panel ---- */
  .editor, .matrix {
    margin-top: 16px; padding: 16px;
    background: linear-gradient(180deg, #46278c, #341a6e);
    border: 1px solid var(--plastic-edge);
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 8px 18px rgba(0,0,0,.35);
  }
  .ed-top { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .engine-sel {
    font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--cyan);
    background: linear-gradient(180deg, var(--well-2), var(--well));
    border: 1px solid #000; border-radius: 9px; padding: 7px 11px; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.5) inset; text-shadow: 0 0 8px rgba(53,232,255,.4);
  }

  /* ---- knobs ---- */
  .knobs { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 4px; }
  .knob { display: flex; flex-direction: column; align-items: center; width: 76px; }
  .dial {
    width: 60px; height: 60px; border-radius: 50%; position: relative; cursor: ns-resize; touch-action: none;
    background: radial-gradient(circle at 36% 30%, #a074e0 0%, #5a2fb0 46%, #341a70 100%);
    box-shadow:
      0 0 0 4px #241046,
      0 0 0 5px rgba(255,255,255,.06),
      0 5px 10px rgba(0,0,0,.5),
      0 2px 3px rgba(255,255,255,.25) inset;
  }
  .dial::before {
    content: ''; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
  }
  .ind {
    position: absolute; left: 50%; top: 7px; width: 4px; height: 20px; margin-left: -2px;
    background: var(--lime); border-radius: 2px; transform-origin: 50% 23px;
    box-shadow: 0 0 8px var(--lime);
  }
  .knob-label { margin-top: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink); font-weight: 600; }
  .knob-val { font-family: var(--tech); font-size: 10px; color: var(--ink-mute); }

  .mini { width: 92px; height: 5px; -webkit-appearance: none; appearance: none; background: transparent; }

  /* ---- pages ---- */
  .pages { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .pgbtn {
    font-family: var(--disp); font-weight: 700; color: #23103f;
    background: linear-gradient(180deg, #c79bff, #9a63e6); border: none; border-radius: 8px;
    padding: 5px 13px; cursor: pointer; box-shadow: 0 3px 0 #5b2fb0, 0 1px 0 rgba(255,255,255,.5) inset;
  }
  .pgbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5b2fb0; }
  .pglbl { font-family: var(--tech); font-size: 11px; color: var(--ink-dim); letter-spacing: 1px; }

  /* ---- step grid ---- */
  .grid { display: flex; flex-direction: column; gap: 12px; }
  .lane {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, var(--well), var(--well-2));
    border: 1px solid #000; border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,.55) inset;
  }
  .lane-tag { width: 40px; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--ink-mute); font-weight: 600; }
  .cells { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; flex: 1; }
  .cell {
    aspect-ratio: 1 / 1; min-width: 0; border: none; border-radius: 9px; cursor: pointer; padding: 0;
    background: radial-gradient(circle at 40% 30%, #3a2560, #1c1038 70%);
    box-shadow: 0 2px 4px rgba(0,0,0,.6) inset, 0 1px 0 rgba(255,255,255,.05);
    position: relative; transition: transform .05s;
    /* Own the touch so a long-press selects instead of scrolling, and suppress
       the iOS text-selection callout that a held press would otherwise raise. */
    touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .cell::after {
    content: ''; position: absolute; inset: 0; border-radius: 9px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .cell.beat { box-shadow: 0 2px 4px rgba(0,0,0,.6) inset, 0 0 0 1px rgba(154,99,230,.4) inset; }
  .cell.on {
    background: radial-gradient(circle at 38% 28%, #eaffb0, var(--lime) 55%, #7bb013 100%);
    box-shadow: 0 0 12px rgba(195,255,62,.6), 0 2px 4px rgba(0,0,0,.35);
  }
  .lane[data-lane="alt"] .cell.on {
    background: radial-gradient(circle at 38% 28%, #ffe6b0, var(--amber) 55%, #c47c10 100%);
    box-shadow: 0 0 12px rgba(255,179,46,.6), 0 2px 4px rgba(0,0,0,.35);
  }
  .cell.selected { z-index: 3; }
  .cell.selected::before {
    content: ''; position: absolute; inset: -5px; border-radius: 13px;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 10px 1px rgba(53,232,255,.9), 0 0 4px rgba(53,232,255,.7);
    pointer-events: none; z-index: 3;
  }
  .cell.play { transform: scale(1.14); box-shadow: 0 0 0 3px var(--magenta), 0 0 16px var(--magenta); animation: pop .18s ease; }
  .cell.disabled { opacity: .22; pointer-events: none; }
  @keyframes pop { 0% { transform: scale(1); } 60% { transform: scale(1.2); } 100% { transform: scale(1.14); } }

  /* ---- step editor ---- */
  .stepedit { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,.4); box-shadow: 0 -1px 0 rgba(255,255,255,.06); }
  .ed-title { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 600; }
  .ed-title .state { font-size: 9px; padding: 2px 9px; border-radius: 20px; letter-spacing: 1px; }
  .ed-title .state.placed { background: rgba(195,255,62,.18); color: var(--lime); border: 1px solid rgba(195,255,62,.4); }
  .ed-title .state.empty { background: rgba(0,0,0,.28); color: var(--ink-mute); border: 1px solid #2c2048; }

  /* Instruction hints */
  .hint {
    font-family: var(--tech); font-size: 11px; line-height: 1.55; color: var(--ink-dim);
    background: rgba(0,0,0,.20); border-left: 3px solid var(--cyan); border-radius: 8px;
    padding: 8px 12px; margin: 4px 0 12px;
  }
  .hint.poly { border-left-color: var(--amber); margin: 14px 0 0; }

  /* Note picker */
  .note-name {
    font-family: var(--tech); font-weight: 700; font-size: 20px; color: var(--amber);
    min-width: 54px; text-align: center; text-shadow: 0 0 8px rgba(255,179,46,.4);
  }
  .note-btn {
    font-family: var(--disp); font-weight: 700; font-size: 16px; line-height: 1; color: #23103f;
    background: linear-gradient(180deg, #c79bff, #9a63e6); border: none; border-radius: 7px;
    width: 26px; height: 26px; cursor: pointer; box-shadow: 0 2px 0 #5b2fb0;
  }
  .note-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #5b2fb0; }
  .ed-field { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .ed-field .lbl { width: 64px; }
  .range { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; }
  .val { font-family: var(--tech); width: 46px; text-align: right; font-size: 12px; color: var(--amber); }

  /* Range track + thumb (candy) */
  .range::-webkit-slider-runnable-track, .mini::-webkit-slider-runnable-track {
    height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--grape-hi), #2a1650);
    box-shadow: 0 1px 3px rgba(0,0,0,.6) inset;
  }
  .range::-webkit-slider-thumb, .mini::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -5px;
    background: radial-gradient(circle at 35% 30%, #fff, var(--magenta) 65%); box-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .range::-moz-range-track, .mini::-moz-range-track {
    height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--grape-hi), #2a1650);
  }
  .range::-moz-range-thumb, .mini::-moz-range-thumb {
    width: 16px; height: 16px; border: none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--magenta) 65%);
  }

  /* ---- mod matrix ---- */
  .matrix-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .matrix-title { font-family: var(--disp); font-weight: 800; color: var(--amber); letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
  .matrix-empty { font-size: 12px; color: var(--ink-mute); }
  .route {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 8px 10px; margin-bottom: 8px;
    background: linear-gradient(180deg, var(--well), var(--well-2));
    border: 1px solid #000; border-radius: 11px; box-shadow: 0 2px 6px rgba(0,0,0,.5) inset;
  }
