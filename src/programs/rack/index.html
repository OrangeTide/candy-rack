<!doctype html>
<!--
  web-rack: the __BRAND_NAME__ machine. One shared app, skinned per machine by
  build.mjs from a machine config (brand, palette, starter pattern).
  Code is 0BSD. Non-code content is PUBLIC DOMAIN (CC0-1.0).

  The two web fonts are a progressive enhancement loaded from Google Fonts. If
  they do not load (offline), the system fallbacks keep the panel readable.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__BRAND_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --disp: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --tech: 'Chakra Petch', ui-monospace, 'Consolas', monospace;

    /* Grape candy palette */
    --m-1: #6a34c8;
    --m-2: #4a2098;
    --m-3: #331466;
    --m-hi: #9a63e6;
    --m-edge: #21103f;
    --m-well: #180d33;
    --m-well-2: #120926;

    --m-ink: #f4ebff;
    --m-ink-dim: #b39ee0;
    --m-ink-mute: #7d68ad;

    --lime: #c3ff3e;
    --magenta: #ff3d9a;
    --cyan: #35e8ff;
    --amber: #ffb32e;
    --lamp: #ff5a7d;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--tech);
    color: var(--m-ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--m-bg-1) 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, var(--m-bg-2) 0%, transparent 55%),
      var(--m-bg-0);
    padding: 40px 18px 70px;
    -webkit-font-smoothing: antialiased;
  }

  /* Shown when the browser lacks AudioWorklet (e.g. iOS Safari < 14.5). */
  .unsupported {
    position: sticky; top: 0; z-index: 100;
    margin: -40px -18px 24px;
    padding: 12px 18px;
    background: var(--m-bg-2);
    border-bottom: 1px solid #a03a7a;
    color: var(--m-ink);
    font-size: 13px; line-height: 1.5; text-align: center;
  }

  /* ---- machine body ---- */
  .machine {
    position: relative;
    max-width: 860px;
    margin: 0 auto;
    padding: 22px 22px 30px;
    border-radius: 30px;
    background:
      linear-gradient(163deg, var(--m-1) 0%, var(--m-2) 52%, var(--m-3) 100%);
    border: 1px solid var(--m-edge);
    box-shadow:
      0 2px 0 rgba(255,255,255,.16) inset,
      0 -34px 60px rgba(0,0,0,.30) inset,
      0 40px 90px rgba(0,0,0,.55),
      0 8px 0 #180b30;
    overflow: hidden;
  }
  /* Top gloss sweep */
  .machine::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 26%);
    pointer-events: none;
  }
  /* Molded plastic micro-texture */
  .machine::after {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: soft-light;
    opacity: .05;
    pointer-events: none;
  }
  .machine > * { position: relative; z-index: 1; }

  /* Corner screws */
  .screw {
    position: absolute; width: 16px; height: 16px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 38% 32%, #d9cff0, #6b5a90 55%, #2b2044 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 0 2px rgba(0,0,0,.18);
  }
  .screw::before {
    content: ''; position: absolute; inset: 4px; border-radius: 2px;
    background: linear-gradient(90deg, transparent 44%, rgba(0,0,0,.5) 44%, rgba(0,0,0,.5) 56%, transparent 56%);
    transform: rotate(35deg);
  }
  .screw.s1 { top: 12px; left: 12px; }
  .screw.s2 { top: 12px; right: 12px; }
  .screw.s3 { bottom: 12px; left: 12px; }
  .screw.s4 { bottom: 12px; right: 12px; }

  /* ---- brand ---- */
  .brand { display: flex; align-items: center; gap: 16px; padding: 6px 8px 18px; }
  .brand-logo { width: 58px; height: 66px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); flex: none; }
  .brand-text { display: flex; flex-direction: column; }
  .wordmark {
    font-family: var(--disp); font-weight: 800; font-size: 46px; line-height: .92;
    letter-spacing: .5px;
    background: linear-gradient(180deg, var(--m-word-1) 0%, var(--m-word-2) 40%, var(--m-word-3) 72%, var(--m-word-4) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.4));
  }
  .model {
    font-family: var(--tech); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 3px; color: var(--m-ink-dim); margin-top: 4px;
  }
  .brand-badge {
    margin-left: auto; align-self: flex-start;
    font-family: var(--disp); font-weight: 700; font-size: 12px; line-height: 1;
    text-transform: uppercase; letter-spacing: 1px; text-align: center; color: #2a0d1f;
    background: linear-gradient(180deg, #ff6aa9, var(--magenta));
    padding: 8px 12px; border-radius: 10px; transform: rotate(3deg);
    box-shadow: 0 3px 0 #b21e5f, 0 6px 12px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.5) inset;
  }

  /* Shared sub-panel look (raised molded card) */
  .head, .rail, .editor, .matrix, .io, .pedals {
    border-radius: 16px;
  }

  /* Engraved section tag */
  .panel-tag, .matrix-title, .lane-tag, .lbl, .knob-label, .chip-n, .ed-title, .rlbl {
    font-family: var(--tech);
    text-shadow: 0 1px 0 rgba(0,0,0,.4), 0 -1px 0 rgba(255,255,255,.06);
  }

  /* ---- transport ---- */
  .head {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--m-panel-1), var(--m-panel-2));
    border: 1px solid var(--m-edge);
    padding: 12px 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 6px 14px rgba(0,0,0,.35);
  }
  .panel-tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--m-ink-dim); font-weight: 600;
  }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .play {
    font-family: var(--disp); font-weight: 800; font-size: 17px; letter-spacing: 1px;
    color: #16330a;
    background: radial-gradient(120% 120% at 30% 20%, #e6ff8f, var(--lime) 55%, #83c015 100%);
    border: none; border-radius: 14px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 6px 0 #5f8a0e, 0 10px 18px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.6) inset;
    transition: transform .05s, box-shadow .05s;
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 #5f8a0e, 0 5px 10px rgba(0,0,0,.4); }

  /* Power lamp: standby amber, lit green while running */
  .power { display: flex; align-items: center; gap: 8px; }
  .lamp {
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffcf9c, #c25a24 68%, #7a3410 100%);
    box-shadow: 0 0 2px rgba(255,140,70,.4), 0 1px 2px rgba(0,0,0,.5) inset, 0 0 0 2px rgba(0,0,0,.28);
    transition: background .15s, box-shadow .15s;
  }
  .power.on .lamp {
    background: radial-gradient(circle at 36% 30%, #e2ffe9, #35e07a 58%, #12873f 100%);
    box-shadow: 0 0 12px rgba(53,224,122,.85), 0 0 4px rgba(53,224,122,1), 0 0 0 2px rgba(0,0,0,.25);
    animation: breathe 2.2s ease-in-out infinite;
  }
  .power-lbl { font-family: var(--tech); font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--m-ink-mute); font-weight: 600; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }

  /* LCD tempo panel */
  .lcd { display: flex; align-items: stretch; gap: 6px; }
  .lcd-screen {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 12px 7px;
    background: linear-gradient(180deg, #052421, #0a352d);
    border: 1px solid #000; border-radius: 9px; position: relative; overflow: hidden;
    box-shadow: 0 2px 7px rgba(0,0,0,.6) inset, 0 0 0 3px #1a0f34, 0 1px 0 rgba(255,255,255,.06);
  }
  .lcd-screen::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  .lcd-cap { font-family: var(--tech); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #45c7a6; text-shadow: 0 0 6px rgba(69,199,166,.5); }
  .lcd-val {
    font-family: var(--tech); font-weight: 700; font-size: 30px; line-height: 1; width: 66px; text-align: right;
    background: transparent; border: none; color: #82ffcf;
    text-shadow: 0 0 10px rgba(130,255,207,.7), 0 0 2px rgba(130,255,207,.9);
    -moz-appearance: textfield;
  }
  .lcd-val:focus { outline: none; }
  .lcd-val::-webkit-inner-spin-button, .lcd-val::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .lcd-unit { font-family: var(--tech); font-size: 11px; letter-spacing: 1px; color: #45c7a6; text-shadow: 0 0 6px rgba(69,199,166,.5); }
  .lcd-steppers { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .lcd-btn {
    font-family: var(--disp); font-weight: 700; font-size: 9px; line-height: 1; color: var(--m-btn-ink);
    background: linear-gradient(180deg, var(--m-btn-1), var(--m-btn-2)); border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer;
    box-shadow: 0 2px 0 var(--m-panel-1);
  }
  .lcd-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--m-panel-1); }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--m-ink-mute); font-weight: 600; }
  .num, .sel {
    font-family: var(--tech); font-weight: 600; font-size: 15px; color: var(--cyan);
    background: linear-gradient(180deg, var(--m-well-2), var(--m-well));
    border: 1px solid #000; border-radius: 8px; padding: 6px 8px; width: 84px;
    box-shadow: 0 2px 5px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.06);
    text-shadow: 0 0 8px rgba(53,232,255,.5);
  }
  .sel { color: var(--m-ink); text-shadow: none; }

  /* ---- track rail ---- */
  /* minmax(0, 1fr), not the default 1fr (= minmax(auto, 1fr)): auto lets a
     column grow to its widest content, so a long engine label (SUPERSAW) or
     the "MUTE" text would make that track wider than the rest. */
  .rail { margin-top: 16px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0;
    padding: 10px 4px 8px; cursor: pointer; text-align: center;
    background: linear-gradient(180deg, var(--m-chip-1), var(--m-chip-2));
    border: 1px solid var(--m-edge); border-radius: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 5px 10px rgba(0,0,0,.35);
    transition: transform .06s, box-shadow .1s, background .1s;
  }
  .chip::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    background: var(--m-chip-2); box-shadow: 0 0 0 2px rgba(0,0,0,.3) inset;
    transition: background .1s, box-shadow .1s;
  }
  .chip.active {
    background: linear-gradient(180deg, var(--m-chip-on-1), var(--m-chip-on-2));
    box-shadow: 0 0 0 2px var(--lime) inset, 0 0 18px rgba(195,255,62,.35), 0 5px 12px rgba(0,0,0,.4);
  }
  .chip.active::before { background: var(--lime); box-shadow: 0 0 8px var(--lime); }
  .chip.fire { transform: translateY(-3px); }
  .chip.fire::before { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
  .chip-n { font-family: var(--disp); font-weight: 800; font-size: 15px; color: var(--amber); }
  .chip-eng { font-family: var(--tech); font-size: 9px; letter-spacing: 0; color: var(--m-ink-dim); min-height: 12px; text-transform: uppercase; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mute {
    font-family: var(--tech); font-size: 8px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
    /* Reserve the width of "MUTE" so toggling to/from "on" does not resize the button. */
    min-width: 40px; text-align: center; box-sizing: border-box;
    background: #1c1140; color: var(--m-ink-mute); border: 1px solid #000; border-radius: 6px; padding: 3px 6px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .mute.on { background: linear-gradient(180deg, #ff6f8c, var(--lamp)); color: #2a0713; border-color: var(--lamp); box-shadow: 0 0 10px rgba(255,90,125,.5); }
  /* Narrow screens: wrap the six tracks into two rows of three so each chip is
     wide enough to show its engine label in full. */
  @media (max-width: 520px) {
    .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ---- editor panel ---- */
  .editor, .matrix, .mixer, .pedals {
    margin-top: 16px; padding: 16px;
    background: linear-gradient(180deg, var(--m-panel-3), var(--m-panel-4));
    border: 1px solid var(--m-edge);
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 8px 18px rgba(0,0,0,.35);
  }
  /* ---- fx pedal rack ---- */
  .fx-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .loop-badge {
    font-family: var(--tech); font-weight: 700; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #04222a; background: linear-gradient(180deg, #7ef0ff, var(--cyan));
    padding: 3px 9px; border-radius: 7px; box-shadow: 0 2px 0 #178a9c;
  }
  .algo-pick { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .algo-cap { font-family: var(--tech); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--m-ink-mute); font-weight: 600; }
  .algo-chip { flex: none; width: 156px; padding: 5px 10px 4px; border-radius: 10px; text-align: center; background: linear-gradient(180deg, var(--m-well-2), var(--m-well)); border: 1px solid #000; box-shadow: 0 2px 5px rgba(0,0,0,.55) inset; }
  .algo-chip.sel { box-shadow: 0 0 0 2px var(--lime) inset, 0 0 14px rgba(195,255,62,.3); }
  .algo-svg { display: block; width: 100%; height: 30px; }
  .algo-svg .box { fill: #3a2168; stroke: var(--m-hi); stroke-width: 1.4; }
  .algo-svg .ln { stroke: var(--lime); stroke-width: 1.4; fill: none; }
  .algo-svg .term { fill: var(--amber); }
  .algo-svg .bl { font-family: var(--disp); font-weight: 800; font-size: 9px; fill: var(--m-ink); }
  .algo-name { font-family: var(--tech); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--lime); margin-top: 2px; font-weight: 600; }
  .fx-flow { font-family: var(--tech); font-size: 11px; line-height: 1.5; color: var(--m-ink-dim); background: rgba(0,0,0,.20); border-left: 3px solid var(--cyan); border-radius: 8px; padding: 8px 12px; margin: 4px 0 12px; }

  .fx-board {
    display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: stretch;
    padding: 14px 12px; border-radius: 14px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 7px), linear-gradient(180deg, #241443, #170c30);
    border: 1px solid #000; box-shadow: 0 3px 10px rgba(0,0,0,.55) inset;
  }
  .rail-end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 30px; }
  .rail-lbl { font-family: var(--tech); font-size: 8px; letter-spacing: 1px; color: var(--m-ink-mute); writing-mode: vertical-rl; text-orientation: mixed; text-transform: uppercase; }
  .jack {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #4a4f5c 0%, #23262f 55%, #0a0b10 100%);
    box-shadow: 0 0 0 3px #15161d, 0 0 0 4px rgba(255,255,255,.05), 0 2px 4px rgba(0,0,0,.6) inset;
  }
  .jack.mono { box-shadow: 0 0 0 3px #15161d, 0 0 0 4px rgba(53,232,255,.25), 0 2px 4px rgba(0,0,0,.6) inset; }

  /* a pedal: tall die-cast enclosure ~1 : 1.8, painted with its accent color
     (real pedals are painted boxes) over the cast-metal gradient. */
  .pedal {
    position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0;
    padding: 12px 8px 14px; border-radius: 12px;
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--accent, #888) 32%, transparent), color-mix(in srgb, var(--accent, #888) 7%, transparent) 55%, transparent 82%),
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 22%),
      linear-gradient(168deg, #3a4150, #262b36 60%, #171a22 100%);
    border: 1px solid #0a0b10;
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 -18px 30px rgba(0,0,0,.22) inset, 0 10px 18px rgba(0,0,0,.5), 0 3px 0 #0c0d12;
  }
  /* Split pedal (Distortion+ / DOD 250): a diagonal two-tone enclosure. */
  .pedal.split {
    background:
      linear-gradient(134deg, color-mix(in srgb, var(--accent-a) 36%, transparent) 0 46%, color-mix(in srgb, var(--accent-b) 36%, transparent) 54% 100%),
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 22%),
      linear-gradient(168deg, #3a4150, #262b36 60%, #171a22 100%);
  }
  .slot-letter { position: absolute; top: 7px; left: 9px; font-family: var(--disp); font-weight: 800; font-size: 13px; color: rgba(255,255,255,.45); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  /* compact on/off switch on the pedal face (e.g. the Ge/Si diode) */
  .pedal-switches { display: flex; justify-content: center; gap: 10px; margin: 2px 0 8px; }
  .pedal-switches .switch { width: auto; }
  .pedal-switches .sw-body { width: 34px; height: 16px; border-radius: 9px; }
  .pedal-switches .sw-body .sw-knob { width: 12px; height: 12px; top: 2px; left: 2px; }
  .pedal-switches .switch.on .sw-body .sw-knob { left: 20px; }
  .pedal-switches .knob-label { margin-top: 4px; font-size: 7.5px; letter-spacing: .5px; }
  /* nameplate = the effect type selector */
  .plate {
    width: 100%; margin-top: 4px; padding: 6px 6px; border-radius: 7px; cursor: pointer; text-align: center; text-align-last: center;
    font-family: var(--disp); font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(180deg, #0d0f15, #05060a); border: 1px solid #000;
    box-shadow: 0 2px 5px rgba(0,0,0,.6) inset;
    color: var(--accent, var(--cyan)); text-shadow: 0 0 8px color-mix(in srgb, var(--accent, var(--cyan)) 45%, transparent);
    -webkit-appearance: none; appearance: none;
  }
  .plate.empty { color: var(--m-ink-mute); text-shadow: none; border-style: dashed; border-color: #2c2048; }
  .plate:focus { outline: none; box-shadow: 0 2px 5px rgba(0,0,0,.6) inset, 0 0 0 2px var(--accent, var(--cyan)); }

  /* Up to 2 rows of 3, --kcols set per pedal. Generous gaps so the controls
     breathe on the pedal face. */
  .pedal-knobs { display: grid; grid-template-columns: repeat(var(--kcols, 3), 1fr); gap: 18px 14px; justify-items: center; align-content: start; margin: 14px 0 8px; min-height: 52px; }
  .pedal-knobs .knob { width: auto; }
  .pedal-knobs .dial {
    width: 38px; height: 38px;
    background: radial-gradient(circle at 36% 30%, #cdd3de 0%, #8a91a1 44%, #464b58 100%);
    box-shadow: 0 0 0 3px #14151b, 0 0 0 4px rgba(255,255,255,.05), 0 3px 6px rgba(0,0,0,.5), 0 1px 2px rgba(255,255,255,.4) inset;
  }
  .pedal-knobs .dial::before { inset: 6px; }
  .pedal-knobs .ind { top: 4px; height: 13px; transform-origin: 50% 15px; background: var(--accent, var(--cyan)); box-shadow: 0 0 6px var(--accent, var(--cyan)); }
  .pedal-knobs .knob-label { margin-top: 5px; font-size: 7.5px; letter-spacing: .5px; color: var(--m-ink-dim); }
  .pedal-knobs .knob-val { font-size: 8px; }
  .pedal.empty-slot .pedal-knobs { opacity: .3; }
  .plate-hint { font-family: var(--tech); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--m-ink-mute); align-self: center; }

  /* status LED above the footswitch */
  .led {
    width: 11px; height: 11px; border-radius: 50%; margin: 6px 0 8px;
    background: radial-gradient(circle at 36% 30%, #6a2030, #360f18 70%);
    box-shadow: 0 1px 2px rgba(0,0,0,.6) inset, 0 0 0 2px rgba(0,0,0,.3);
  }
  /* The bypass LED lights when engaged; the secondary LED (sw2-led) is driven
     by its own .lit2 state, not the bypass, so it is excluded here. */
  .pedal.on .led:not(.sw2-led) {
    background: radial-gradient(circle at 36% 30%, #eafff4, var(--accent, var(--cyan)) 55%, #12873f 100%);
    box-shadow: 0 0 12px 1px var(--accent, var(--cyan)), 0 0 4px var(--accent, var(--cyan)), 0 0 0 2px rgba(0,0,0,.25);
  }
  .led.lit2 {
    background: radial-gradient(circle at 36% 30%, #eafff4, var(--accent, var(--cyan)) 55%, #12873f 100%);
    box-shadow: 0 0 12px 1px var(--accent, var(--cyan)), 0 0 4px var(--accent, var(--cyan)), 0 0 0 2px rgba(0,0,0,.25);
  }

  /* Footswitch zone: the safe rectangle at the bottom of the pedal, set apart
     from the knobs. margin-top:auto pins it to the base of the stretched pedal;
     .two lays out the bypass and secondary footswitches side by side. */
  .pedal-footzone {
    margin-top: auto; align-self: stretch;
    display: flex; justify-content: center; gap: 16px;
    padding: 12px 8px 8px; border-radius: 11px;
    background: rgba(0,0,0,.24);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset, 0 1px 0 rgba(255,255,255,.05) inset;
  }
  .pedal-footzone .foot { display: flex; flex-direction: column; align-items: center; }

  /* silver footswitch near the bottom */
  .stomp {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; position: relative; border: none; padding: 0;
    background: radial-gradient(circle at 50% 34%, #e8ecf2 0%, #aab2c0 40%, #6d7585 68%, #3a3f4c 100%);
    box-shadow: 0 0 0 3px #14151b, 0 0 0 5px rgba(255,255,255,.06), 0 5px 9px rgba(0,0,0,.6), 0 2px 3px rgba(255,255,255,.5) inset;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .stomp::before {
    content: ''; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 50% 36%, #f4f6fa, #9aa2b1 60%, #5b6270 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.5) inset, 0 -2px 3px rgba(255,255,255,.4) inset;
  }
  .stomp:active { transform: translateY(2px); box-shadow: 0 0 0 3px #14151b, 0 0 0 5px rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.6), 0 2px 3px rgba(255,255,255,.5) inset; }
  .stomp-lbl { font-family: var(--tech); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: var(--m-ink-mute); margin-top: 7px; }
  .pedal.on .stomp-lbl { color: var(--accent, var(--cyan)); }

  @media (max-width: 560px) {
    .fx-board { grid-template-columns: auto repeat(2, minmax(0, 1fr)) auto; }
  }

  /* Mixer: a row of channel strips (Level/Pan/Send) plus the master strip. */
  .mix-strips { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; margin-top: 8px; }
  .mix-strip {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: 12px; background: rgba(0,0,0,.18);
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
  }
  .mix-strip.master { background: rgba(195,255,62,.07); box-shadow: 0 0 0 1px rgba(195,255,62,.22) inset; }
  .mix-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .mix-t { font-family: var(--tech); font-size: 10px; letter-spacing: 1px; color: var(--amber); text-transform: uppercase; font-weight: 700; }
  .mix-strip.master .mix-t { color: var(--lime); }
  .mix-strip .knob { width: 66px; }
  .mix-strip.dimmed { opacity: .42; }
  .solo {
    font-family: var(--tech); font-size: 8px; font-weight: 700; letter-spacing: .5px;
    width: 18px; height: 16px; padding: 0; border-radius: 5px; cursor: pointer;
    background: #1c1140; color: var(--m-ink-mute); border: 1px solid #000;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .solo.on { background: linear-gradient(180deg, #7ef0ff, var(--cyan)); color: #04222a; border-color: var(--cyan); box-shadow: 0 0 8px rgba(53,232,255,.55); }
  .mix-reso { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }

  /* Kit part selector and part rows */
  .part-tabs { display: flex; gap: 6px; }
  .part-tab {
    font-family: var(--disp); font-weight: 800; font-size: 13px; letter-spacing: 1px;
    color: var(--m-ink-dim); background: linear-gradient(180deg, var(--m-well-2), var(--m-well));
    border: 1px solid #000; border-radius: 8px; padding: 6px 12px; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.5) inset;
  }
  .part-tab.on { color: #2a0713; background: linear-gradient(180deg, #ffd27a, var(--amber)); border-color: var(--amber); box-shadow: 0 0 10px rgba(255,179,46,.5); }
  .lane-tag.partsel { color: var(--amber); text-shadow: 0 0 8px rgba(255,179,46,.6); }
  .lane[data-lane^="part"] .lane-tag { cursor: pointer; }
  /* Part selector + its Type, side by side, with room before the knobs. */
  .kit-head { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  /* Per-part row: P-label plus a mute button. */
  .kit-lane-head { display: flex; align-items: center; gap: 6px; }
  .lanemute {
    font-family: var(--tech); font-size: 8px; font-weight: 700; width: 16px; height: 15px;
    padding: 0; border-radius: 4px; cursor: pointer; background: #1c1140; color: var(--m-ink-mute);
    border: 1px solid #000; -webkit-user-select: none; user-select: none;
  }
  .lanemute.on { background: linear-gradient(180deg, #ff6f8c, var(--lamp)); color: #2a0713; border-color: var(--lamp); box-shadow: 0 0 8px rgba(255,90,125,.5); }
  .lane-muted .cells { opacity: .4; }

  /* Swing control in the transport */
  .swing-slider { width: 78px; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  .swing-slider::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), #1c1140); }
  .swing-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #fff, var(--cyan)); box-shadow: 0 0 6px rgba(53,232,255,.7); }
  .swing-slider::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--cyan); }
  .ed-top { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .engine-sel {
    font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--cyan);
    background: linear-gradient(180deg, var(--m-well-2), var(--m-well));
    border: 1px solid #000; border-radius: 9px; padding: 7px 11px; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.5) inset; text-shadow: 0 0 8px rgba(53,232,255,.4);
  }

  /* ---- knobs ---- */
  .knobs { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 4px; }
  .knob { display: flex; flex-direction: column; align-items: center; width: 76px; }
  .dial {
    width: 60px; height: 60px; border-radius: 50%; position: relative; cursor: ns-resize; touch-action: none;
    -webkit-user-select: none; user-select: none;
    background: radial-gradient(circle at 36% 30%, var(--m-dial-1) 0%, var(--m-dial-2) 46%, var(--m-dial-3) 100%);
    box-shadow:
      0 0 0 4px #241046,
      0 0 0 5px rgba(255,255,255,.06),
      0 5px 10px rgba(0,0,0,.5),
      0 2px 3px rgba(255,255,255,.25) inset;
  }
  .dial::before {
    content: ''; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
  }
  .ind {
    position: absolute; left: 50%; top: 7px; width: 4px; height: 20px; margin-left: -2px;
    background: var(--lime); border-radius: 2px; transform-origin: 50% 23px;
    box-shadow: 0 0 8px var(--lime);
  }
  .knob-label { margin-top: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--m-ink); font-weight: 600; }
  .knob-val { font-family: var(--tech); font-size: 10px; color: var(--m-ink-mute); }

  /* Engine on/off switches, up to 3 per engine, beside the knobs. Unused slots
     for the engine are dimmed. */
  .switches { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 10px; }
  .switch { display: flex; flex-direction: column; align-items: center; width: 76px; }
  .sw-body {
    width: 46px; height: 24px; border-radius: 13px; position: relative; cursor: pointer; touch-action: none;
    -webkit-user-select: none; user-select: none;
    background: #241046; border: 1px solid #3a1f6e;
    box-shadow: 0 2px 4px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.08);
    transition: background .12s;
  }
  .sw-body .sw-knob {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #b79bec, #6a3fc0);
    box-shadow: 0 2px 3px rgba(0,0,0,.5); transition: left .12s;
  }
  .switch.on .sw-body { background: linear-gradient(180deg, #7bd86a, #3f9b2f); border-color: var(--lime); box-shadow: 0 0 8px rgba(123,216,106,.45) inset; }
  .switch.on .sw-body .sw-knob { left: 26px; background: radial-gradient(circle at 38% 30%, #eaffe4, #9fe08c); }
  .switch.disabled { opacity: .28; pointer-events: none; }
  .switch .knob-label { margin-top: 6px; }

  .mini { width: 92px; height: 5px; -webkit-appearance: none; appearance: none; background: transparent; }

  /* ---- pages ---- */
  /* Sequence bar above the step grid: page nav + Speed / Length / Swing. */
  .seq-bar { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 16px 0 10px; }
  .seq-bar .pages { margin: 0; }
  .seq-bar .field { gap: 5px; }
  .swing-row { display: flex; align-items: center; gap: 8px; }
  .swing-val { font-family: var(--tech); font-size: 11px; color: var(--cyan); min-width: 34px; text-align: right; text-shadow: 0 0 8px rgba(53,232,255,.4); }
  .pages { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .pgbtn {
    font-family: var(--disp); font-weight: 700; color: var(--m-btn-ink);
    background: linear-gradient(180deg, var(--m-btn-1), var(--m-btn-2)); border: none; border-radius: 8px;
    padding: 5px 13px; cursor: pointer; box-shadow: 0 3px 0 var(--m-panel-1), 0 1px 0 rgba(255,255,255,.5) inset;
  }
  .pgbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--m-panel-1); }
  .pglbl { font-family: var(--tech); font-size: 11px; color: var(--m-ink-dim); letter-spacing: 1px; }

  /* ---- step grid ---- */
  .grid { display: flex; flex-direction: column; gap: 12px; }
  .lane {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, var(--m-well), var(--m-well-2));
    border: 1px solid #000; border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,.55) inset;
  }
  .lane-tag { width: 40px; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--m-ink-mute); font-weight: 600; }
  .cells { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; flex: 1; }
  .cell {
    aspect-ratio: 1 / 1; min-width: 0; border: none; border-radius: 9px; cursor: pointer; padding: 0;
    background: radial-gradient(circle at 40% 30%, #3a2560, #1c1038 70%);
    box-shadow: 0 2px 4px rgba(0,0,0,.6) inset, 0 1px 0 rgba(255,255,255,.05);
    position: relative; transition: transform .05s;
    /* Own the touch so a long-press selects instead of scrolling, and suppress
       the iOS text-selection callout that a held press would otherwise raise. */
    touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .cell::after {
    content: ''; position: absolute; inset: 0; border-radius: 9px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .cell.beat { box-shadow: 0 2px 4px rgba(0,0,0,.6) inset, 0 0 0 1px rgba(154,99,230,.4) inset; }
  .cell.on {
    background: radial-gradient(circle at 38% 28%, #eaffb0, var(--lime) 55%, #7bb013 100%);
    box-shadow: 0 0 12px rgba(195,255,62,.6), 0 2px 4px rgba(0,0,0,.35);
  }
  .lane[data-lane="alt"] .cell.on {
    background: radial-gradient(circle at 38% 28%, #ffe6b0, var(--amber) 55%, #c47c10 100%);
    box-shadow: 0 0 12px rgba(255,179,46,.6), 0 2px 4px rgba(0,0,0,.35);
  }
  /* Slide marker: a small arrow in the corner meaning "glide into the next
     note". Sits above the cell gloss and reads on both lit and dark cells. */
  .slide-mark {
    position: absolute; right: 4px; bottom: 4px; width: 0; height: 0; z-index: 2;
    border-left: 7px solid var(--cyan); border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    filter: drop-shadow(0 0 3px rgba(53,232,255,.9)); pointer-events: none;
  }
  /* Tie marker: a bar bridging the gap from the previous cell, meaning "held
     from the previous note". */
  .tie-mark {
    position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 4px; border-radius: 2px; z-index: 2;
    background: var(--amber); box-shadow: 0 0 5px rgba(255,179,46,.8); pointer-events: none;
  }
  .cell.selected { z-index: 3; }
  .cell.selected::before {
    content: ''; position: absolute; inset: -5px; border-radius: 13px;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 10px 1px rgba(53,232,255,.9), 0 0 4px rgba(53,232,255,.7);
    pointer-events: none; z-index: 3;
  }
  .cell.play { transform: scale(1.14); box-shadow: 0 0 0 3px var(--magenta), 0 0 16px var(--magenta); animation: pop .18s ease; }
  .cell.disabled { opacity: .22; pointer-events: none; }
  @keyframes pop { 0% { transform: scale(1); } 60% { transform: scale(1.2); } 100% { transform: scale(1.14); } }

  /* ---- step editor ---- */
  .stepedit { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,.4); box-shadow: 0 -1px 0 rgba(255,255,255,.06); }
  .ed-title { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 600; }
  .ed-title .state { font-size: 9px; padding: 2px 9px; border-radius: 20px; letter-spacing: 1px; }
  .ed-title .state.placed { background: rgba(195,255,62,.18); color: var(--lime); border: 1px solid rgba(195,255,62,.4); }
  .ed-title .state.empty { background: rgba(0,0,0,.28); color: var(--m-ink-mute); border: 1px solid #2c2048; }

  /* Instruction hints */
  .hint {
    font-family: var(--tech); font-size: 11px; line-height: 1.55; color: var(--m-ink-dim);
    background: rgba(0,0,0,.20); border-left: 3px solid var(--cyan); border-radius: 8px;
    padding: 8px 12px; margin: 4px 0 12px;
  }
  .hint.poly { border-left-color: var(--amber); margin: 14px 0 0; }

  /* Note picker */
  .note-name {
    font-family: var(--tech); font-weight: 700; font-size: 20px; color: var(--amber);
    min-width: 54px; text-align: center; text-shadow: 0 0 8px rgba(255,179,46,.4);
  }
  .note-btn {
    font-family: var(--disp); font-weight: 700; font-size: 16px; line-height: 1; color: var(--m-btn-ink);
    background: linear-gradient(180deg, var(--m-btn-1), var(--m-btn-2)); border: none; border-radius: 7px;
    width: 26px; height: 26px; cursor: pointer; box-shadow: 0 2px 0 var(--m-panel-1);
  }
  .note-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--m-panel-1); }
  .ed-field { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .ed-field .lbl { width: 64px; }
  .range { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; }
  .val { font-family: var(--tech); width: 46px; text-align: right; font-size: 12px; color: var(--amber); }

  /* Range track + thumb (candy) */
  .range::-webkit-slider-runnable-track, .mini::-webkit-slider-runnable-track {
    height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--m-hi), #2a1650);
    box-shadow: 0 1px 3px rgba(0,0,0,.6) inset;
  }
  .range::-webkit-slider-thumb, .mini::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -5px;
    background: radial-gradient(circle at 35% 30%, #fff, var(--magenta) 65%); box-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .range::-moz-range-track, .mini::-moz-range-track {
    height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--m-hi), #2a1650);
  }
  .range::-moz-range-thumb, .mini::-moz-range-thumb {
    width: 16px; height: 16px; border: none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--magenta) 65%);
  }

  /* ---- mod matrix ---- */
  .matrix-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .matrix-title { font-family: var(--disp); font-weight: 800; color: var(--amber); letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
  .matrix-empty { font-size: 12px; color: var(--m-ink-mute); }
  .route {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 8px 10px; margin-bottom: 8px;
    background: linear-gradient(180deg, var(--m-well), var(--m-well-2));
    border: 1px solid #000; border-radius: 11px; box-shadow: 0 2px 6px rgba(0,0,0,.5) inset;
  }
  .sel.sm { width: auto; padding: 4px 6px; font-size: 12px; }
  .route .mini { width: 76px; }
  .arrow { color: var(--lime); font-weight: 800; margin: 0 2px; text-shadow: 0 0 8px rgba(195,255,62,.5); }
  .rlbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--m-ink-mute); }
  .rv { font-family: var(--tech); font-size: 11px; color: var(--amber); width: 26px; text-align: right; }
  .pol {
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 16px; color: var(--m-btn-ink);
    background: linear-gradient(180deg, var(--m-btn-1), var(--m-btn-2)); border: none; box-shadow: 0 2px 0 var(--m-panel-1);
  }
  .rm {
    margin-left: auto; width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 12px;
    background: #2a0f22; color: var(--lamp); border: 1px solid #611c3f;
  }

  /* ---- io ---- */
  .io { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .iobtn {
    font-family: var(--tech); font-weight: 600; font-size: 12px; letter-spacing: .5px;
    background: linear-gradient(180deg, var(--m-chip-1), var(--m-chip-2)); color: var(--m-ink);
    border: 1px solid var(--m-edge); border-radius: 10px; padding: 9px 16px; cursor: pointer;
    box-shadow: 0 3px 0 #1f1040, 0 1px 0 rgba(255,255,255,.12) inset;
  }
  .iobtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1f1040; }
  .iobtn:hover { color: var(--cyan); }
  .iobtn.rec {
    color: #2a0713; font-weight: 700;
    background: linear-gradient(180deg, #ff6f8c, var(--lamp)); border-color: var(--lamp);
    box-shadow: 0 3px 0 #7a1330, 0 1px 0 rgba(255,255,255,.4) inset;
  }
  .iobtn.rec:hover { color: #2a0713; }
  .rec-mode { width: 150px; color: var(--m-ink); }
</style>
<!-- Per-machine palette (injected by build.mjs); overrides the Grape defaults above. -->
__MACHINE_STYLE__
</head>

<div class="machine">
  <div class="screw s1"></div><div class="screw s2"></div><div class="screw s3"></div><div class="screw s4"></div>

    <div class="brand-text">
      <div class="wordmark">__BRAND_NAME__</div>
