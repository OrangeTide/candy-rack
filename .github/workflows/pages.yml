name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the top; the deploy job widens what it needs.
permissions:
  contents: read

# Let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install toolchain
        run: npm ci
      - name: Build programs
        run: node build.mjs
      - name: Headless audio checks
        run: node test/audio-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
